name: Release
on:
  workflow_dispatch:

  schedule:
    - cron: '18 3 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is_ready: ${{ steps.gate.outputs.is_ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for new commits since last release
        id: commits
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "### No previous tag — proceeding with first release." >> "$GITHUB_STEP_SUMMARY"
          else
            COUNT=$(git log "${LAST_TAG}..HEAD" --oneline --no-merges \
              --invert-grep --grep='update changelog' \
              | wc -l | tr -d ' ')
            if [ "$COUNT" -gt 0 ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "### :rocket: ${COUNT} new commit(s) since \`${LAST_TAG}\` — will release." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "### :zzz: No new commits since \`${LAST_TAG}\` — skipping release." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Check NPM_TOKEN
        id: npm
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "npm_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_ready=false" >> "$GITHUB_OUTPUT"
            echo "### :warning: \`NPM_TOKEN\` secret is not set — skipping release. See issue [#45](https://github.com/stefanhoth/dossier/issues/45)." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Gate
        id: gate
        run: |
          if [ "${{ steps.commits.outputs.has_changes }}" == "true" ] && [ "${{ steps.npm.outputs.npm_ready }}" == "true" ]; then
            echo "is_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_ready=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.is_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

      - name: Compute CalVer tag
        id: calver
        run: |
          BASE=$(date -u +"%Y.%m.%d")
          VERSION="$BASE"
          COUNTER=0
          while git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; do
            COUNTER=$((COUNTER + 1))
            VERSION="${BASE}.${COUNTER}"
          done
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Bump version in package.json
        run: npm version "${{ steps.calver.outputs.tag }}" --no-git-tag-version
      - name: Build
        run: npm run build

      - name: Create Draft Release via GH CLI
        id: create_release
        run: |
          gh release create "${{ steps.calver.outputs.tag }}" --draft --generate-notes
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          gh release view "${{ steps.calver.outputs.tag }}" --json body --jq .body >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        run: |
          touch CHANGELOG.md
          printf "## [Release %s](https://github.com/stefanhoth/dossier/releases/tag/%s)\n\n%s\n\n---\n\n" \
            "${{ steps.calver.outputs.tag }}" \
            "${{ steps.calver.outputs.tag }}" \
            "${{ steps.create_release.outputs.notes }}" \
            | cat - CHANGELOG.md > TEMP_CHANGELOG.md && mv TEMP_CHANGELOG.md CHANGELOG.md

      - name: Commit and Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ steps.calver.outputs.tag }} [skip ci]"
          git push origin HEAD
          gh release edit "${{ steps.calver.outputs.tag }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
